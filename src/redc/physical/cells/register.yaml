# State-element cells.  Every register variant must expose four pins:
#   next (data in), enable (bool), clk (bool, the clock net), out (data out).
# Key convention:  <datatype>_register_<pin>-<x>-<y>-<z>...
family: register
datatype: uint8          # family default for the data pins; control pins override

variants:
  uint8_register_next-0-0-0_enable-0-0-1_clk-0-0-2_out-0-0-2:
    latency: 1
    init: 0
    dim: [1, 1, 3]
    nbt: uint8_register_next-0-0-0_enable-0-0-1_clk-0-0-2_out-0-0-2.nbt
    inputs:
      - {name: next, face: WEST, offset: [0, 0, 0]}
      - {name: enable, datatype: bool, face: WEST, offset: [0, 0, 1]}
      - {name: clk, datatype: bool, face: BOTTOM, offset: [0, 0, 2]}
    outputs:
      - {name: out, face: EAST, offset: [0, 0, 2]}
