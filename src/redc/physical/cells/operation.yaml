# Datapath operation cells.  Key = convention name:
#   <datatype>_<op>_<pin>-<x>-<y>-<z>...   (one <pin>-x-y-z group per port)
# Every field is explicit; the key is the canonical id, not parsed for data.
#
# Cells are indexed by their exact operation signature (op + full result and
# operand types), so uint8 and int8 variants are distinct even where the
# hardware could be shared.  Input pins are listed in IR operand order:
#   binary ops / compares: a, b      mux: sel, yes, no      shifts: value, amount
# Shift amounts are always a uint64 input, matching the IR.
#
# These are geometry stubs: no Minecraft structure exists yet (nbt: null) and
# latency is a placeholder until real circuits are measured.
family: operation

# Anchors only -- the loader reads `datatype` and `variants`.
types:
  ints: &ints [uint4, int4, uint8, int8, uint16, int16, uint32, int32, uint64, int64]
  all: &all [bool, uint4, int4, uint8, int8, uint16, int16, uint32, int32, uint64, int64]

layouts:
  binary: &binary
    latency: 0
    dim: [1, 1, 3]
    nbt: null
    inputs:
      - {name: a, face: WEST, offset: [0, 0, 0]}
      - {name: b, face: WEST, offset: [0, 0, 1]}
    outputs:
      - {name: out, face: EAST, offset: [0, 0, 2]}
  compare: &compare
    latency: 0
    dim: [1, 1, 3]
    nbt: null
    inputs:
      - {name: a, face: WEST, offset: [0, 0, 0]}
      - {name: b, face: WEST, offset: [0, 0, 1]}
    outputs:
      - {name: out, datatype: bool, face: EAST, offset: [0, 0, 2]}
  unary: &unary
    latency: 0
    dim: [1, 1, 1]
    nbt: null
    inputs:
      - {name: a, face: WEST, offset: [0, 0, 0]}
    outputs:
      - {name: out, face: EAST, offset: [0, 0, 0]}
  shift: &shift
    latency: 0
    dim: [1, 1, 3]
    nbt: null
    inputs:
      - {name: value, face: WEST, offset: [0, 0, 0]}
      - {name: amount, datatype: uint64, face: WEST, offset: [0, 0, 1]}
    outputs:
      - {name: out, face: EAST, offset: [0, 0, 2]}
  mux: &mux
    latency: 0
    dim: [1, 1, 3]
    nbt: null
    inputs:
      - {name: sel, datatype: bool, face: WEST, offset: [0, 0, 0]}
      - {name: "yes", face: WEST, offset: [0, 0, 1]}
      - {name: "no", face: WEST, offset: [0, 0, 2]}
    outputs:
      - {name: out, face: EAST, offset: [0, 0, 2]}

variants:
  # -- arithmetic / bitwise: op(T, T) -> T ----------------------------------
  "{t}_add_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *binary, op: add, datatype: "{t}", expand: {t: *ints}}

  # Same op, inputs stacked vertically instead of along z -- a second layout
  # the router can pick when neighbours constrain the z axis.  Candidates for
  # one signature are returned in YAML order.
  uint8_add_a-0-0-0_b-0-1-0_out-0-2-0:
    op: add
    datatype: uint8
    latency: 0
    dim: [1, 3, 1]
    nbt: null
    inputs:
      - {name: a, face: WEST, offset: [0, 0, 0]}
      - {name: b, face: WEST, offset: [0, 1, 0]}
    outputs:
      - {name: out, face: EAST, offset: [0, 2, 0]}

  "{t}_sub_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *binary, op: sub, datatype: "{t}", expand: {t: *ints}}
  "{t}_mul_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *binary, op: mul, datatype: "{t}", expand: {t: *ints}}
  "{t}_div_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *binary, op: div, datatype: "{t}", expand: {t: *ints}}
  "{t}_mod_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *binary, op: mod, datatype: "{t}", expand: {t: *ints}}
  "{t}_and_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *binary, op: and, datatype: "{t}", expand: {t: *ints}}
  "{t}_or_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *binary, op: or, datatype: "{t}", expand: {t: *ints}}
  "{t}_xor_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *binary, op: xor, datatype: "{t}", expand: {t: *ints}}

  # -- unary: op(T) -> T ----------------------------------------------------
  "{t}_neg_a-0-0-0_out-0-0-0": {<<: *unary, op: neg, datatype: "{t}", expand: {t: *ints}}
  "{t}_inv_a-0-0-0_out-0-0-0": {<<: *unary, op: inv, datatype: "{t}", expand: {t: *ints}}

  # -- comparisons: op(T, T) -> bool ----------------------------------------
  "{t}_eq_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *compare, op: eq, datatype: "{t}", expand: {t: *all}}
  "{t}_ne_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *compare, op: ne, datatype: "{t}", expand: {t: *all}}
  "{t}_lt_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *compare, op: lt, datatype: "{t}", expand: {t: *ints}}
  "{t}_le_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *compare, op: le, datatype: "{t}", expand: {t: *ints}}
  "{t}_gt_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *compare, op: gt, datatype: "{t}", expand: {t: *ints}}
  "{t}_ge_a-0-0-0_b-0-0-1_out-0-0-2": {<<: *compare, op: ge, datatype: "{t}", expand: {t: *ints}}

  # -- variable shifts: op(T value, uint64 amount) -> T ---------------------
  # shr on a signed T is arithmetic, on an unsigned T logical; the signature's
  # value type keeps them distinct.  Constant shifts are a later rewrite.
  "{t}_shl_value-0-0-0_amount-0-0-1_out-0-0-2": {<<: *shift, op: shl, datatype: "{t}", expand: {t: *ints}}
  "{t}_shr_value-0-0-0_amount-0-0-1_out-0-0-2": {<<: *shift, op: shr, datatype: "{t}", expand: {t: *ints}}

  # -- select: mux(bool sel, T yes, T no) -> T ------------------------------
  "{t}_mux_sel-0-0-0_yes-0-0-1_no-0-0-2_out-0-0-2": {<<: *mux, op: mux, datatype: "{t}", expand: {t: *all}}
