# Single-bit boolean gate cells.
family: primitive_gate
datatype: bool

variants:
  bool_and_in0-0-0-0_in1-0-0-1_out-0-0-2:
    op: and
    latency: 1
    dim: [1, 1, 3]
    nbt: bool_and_in0-0-0-0_in1-0-0-1_out-0-0-2.nbt
    inputs:
      - {name: in0, face: WEST, offset: [0, 0, 0]}
      - {name: in1, face: WEST, offset: [0, 0, 1]}
    outputs:
      - {name: out, face: EAST, offset: [0, 0, 2]}

  bool_not_in0-0-0-0_out-0-0-0:
    op: not
    latency: 1
    dim: [1, 1, 1]
    nbt: bool_not_in0-0-0-0_out-0-0-0.nbt
    inputs:
      - {name: in0, face: WEST, offset: [0, 0, 0]}
    outputs:
      - {name: out, face: EAST, offset: [0, 0, 0]}
