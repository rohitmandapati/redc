# Single-bit boolean gate cells.  Combinational, each with one tick of
# propagation delay (latency is delay, not state).
# Geometry stubs: no Minecraft structure exists yet (nbt: null).
family: primitive_gate
datatype: bool

layouts:
  binary: &binary
    latency: 1
    dim: [1, 1, 3]
    nbt: null
    inputs:
      - {name: in0, face: WEST, offset: [0, 0, 0]}
      - {name: in1, face: WEST, offset: [0, 0, 1]}
    outputs:
      - {name: out, face: EAST, offset: [0, 0, 2]}

variants:
  bool_and_in0-0-0-0_in1-0-0-1_out-0-0-2: {<<: *binary, op: and}
  bool_or_in0-0-0-0_in1-0-0-1_out-0-0-2: {<<: *binary, op: or}
  bool_xor_in0-0-0-0_in1-0-0-1_out-0-0-2: {<<: *binary, op: xor}

  bool_not_in0-0-0-0_out-0-0-0:
    op: not
    latency: 1
    dim: [1, 1, 1]
    nbt: null
    inputs:
      - {name: in0, face: WEST, offset: [0, 0, 0]}
    outputs:
      - {name: out, face: EAST, offset: [0, 0, 0]}
