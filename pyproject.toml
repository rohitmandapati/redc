[project]
name = "redc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohit Mandapati", email = "rohitmandapati06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lark>=1.3.1",
    "nbtlib>=2.0.4",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
redc = "redc:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "quickjs>=1.19.4",
    "ruff>=0.16.9",
]
